<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COCA-COLA NEALKO CENÍK</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
          --cc-red: #ed1c24; 
          --cc-black: #000000; 
          --bg-dark: #121212;
          --container-bg: #1e1e1e;
          --card-bg: #2d2d2d;
          --border-color: #333333;
          --text-main: #f8f9fa;
          --text-muted: #b0b0b0;
        }
        
        body { 
          font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
          margin: 0; 
          padding: 10px; 
          background-color: var(--bg-dark); 
          color: var(--text-main); 
        }

        .container { 
          max-width: 1400px; 
          margin: auto; 
          background: var(--container-bg); 
          padding: 20px; 
          border-radius: 8px; 
          box-shadow: 0 0 20px rgba(0,0,0,0.5); 
        }

        h1 { 
          color: var(--cc-red); 
          border-bottom: 3px solid var(--cc-red); 
          padding-bottom: 10px; 
          margin-top: 0; 
          font-size: 1.5rem;
          text-align: center;
          text-transform: uppercase;
        }
        
        .header-fields { 
          display: grid; 
          grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
          gap: 15px; 
          margin-bottom: 25px; 
          background: var(--card-bg); 
          padding: 15px; 
          border-radius: 5px; 
          border: 1px solid var(--border-color); 
        }

        .field-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.85em; color: var(--text-muted); }
        input[type="text"], input[type="number"] { 
          padding: 10px; 
          border: 1px solid #444; 
          border-radius: 4px; 
          font-size: 16px; 
          background: #fff; 
          color: #000;
        }

        .section-header { 
          background: var(--cc-red); 
          color: white; 
          padding: 12px 15px; 
          margin-top: 30px; 
          display: flex; 
          flex-wrap: wrap;
          justify-content: space-between; 
          align-items: center; 
          border-radius: 4px 4px 0 0; 
          gap: 10px;
          font-weight: bold;
        }

        .section-discount-input { display: flex; align-items: center; gap: 10px; font-size: 0.85em; }
        .section-discount-input input { width: 50px; padding: 5px; border-radius: 3px; border: none; text-align: center; color: #000; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid var(--border-color);
            margin-bottom: 5px;
            background: var(--card-bg);
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.8rem; 
            min-width: 1000px; 
        }

        th { 
            background: #252525; 
            color: var(--text-main);
            text-align: center; 
            padding: 8px 4px; 
            border-bottom: 2px solid var(--border-color); 
            font-size: 0.72rem;
            line-height: 1.15;
            vertical-align: middle;
        }

        th.col-product { 
            text-align: left; 
            width: 38%; 
            font-size: 0.85rem;
        }

        td { 
            padding: 8px 4px; 
            border-bottom: 1px solid var(--border-color); 
            text-align: center;
            color: var(--text-main);
            vertical-align: middle;
        }

        td.col-product { 
            text-align: left; 
            font-weight: 600;
            line-height: 1.35;
        }
        
        input.qty { width: 40px; padding: 4px; text-align: center; font-weight: bold; color: #000; }
        input.disc { width: 35px; padding: 4px; text-align: center; color: #000; }

        .row-total { font-weight: bold; color: var(--cc-red); white-space: nowrap; }
        .final-unit-price { font-weight: bold; color: #ff8a80; white-space: nowrap; }
        .unit-price { color: var(--text-muted); white-space: nowrap; }

        .summary-bar { 
          background: var(--cc-red); 
          color: white; 
          padding: 20px; 
          display: flex; 
          flex-direction: column;
          gap: 10px;
          border-radius: 8px; 
          margin-top: 30px; 
          font-size: 1.1em; 
          font-weight: bold; 
          text-align: center;
        }

        @media (min-width: 600px) {
          .summary-bar { flex-direction: row; justify-content: space-between; text-align: left; }
          h1 { font-size: 2rem; }
        }

        .btn-export { 
          background: #28a745; 
          color: white; 
          border: none; 
          padding: 15px 25px; 
          border-radius: 5px; 
          cursor: pointer; 
          font-size: 1em; 
          font-weight: bold; 
          width: 100%;
          margin-bottom: 20px; 
        }

        @media print { 
          .no-print { display: none !important; } 
          .container { box-shadow: none; border: none; padding: 0; max-width: 100%; background: white; color: black; } 
          body { margin: 0; padding: 0; background-color: white; color: black; }
          .table-responsive { overflow: visible; background: white; }
          th { background: #eee !important; color: black !important; border-bottom: 2px solid #000; }
          td { color: black !important; border-bottom: 1px solid #ccc; }
          .section-header { background: #000 !important; color: white !important; }
          .summary-bar { background: #ed1c24 !important; color: white !important; }
          table { min-width: 100%; font-size: 6.5pt; }
          .row-total { color: black !important; }
          .final-unit-price { color: #d32f2f !important; }
          .unit-price { color: #333 !important; }
        }
    </style>
</head>

function renderApp() {
    const container = document.getElementById('sections-container');
    container.innerHTML = ''; 
    let sectionIdx = 0;

    for (const [sectionName, items] of Object.entries(pricingData)) {
        const isBIB = sectionName.includes("B-I-B");
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'section-wrapper';
        
        sectionDiv.innerHTML = `
            <div class="section-header">
              <span>${sectionName}</span>
              <div class="section-discount-input no-print">
                Plošná sleva sekce: <input type="number" class="sec-disc" data-section="${sectionIdx}" value="0" min="0" oninput="updateAll()"> %
              </div>
            </div>
            <div class="table-responsive">
              <table>
                  <thead>
                      <tr>
                          <th class="col-product">Výrobek</th>
                          <th>Objem</th>
                          <th>Bal.<br>(ks)</th>
                          <th>Zákl. cena bal.<br>(bez DPH)</th>
                          <th>${isBIB ? 'Zákl. cena/0,1L<br>(bez DPH)' : 'Zákl. cena/ks<br>(bez DPH)'}</th>
                          <th>Sleva<br>%</th>
                          <th>Po slevě/bal.<br>(bez DPH)</th>
                          <th>Po slevě/ks<br>(bez DPH)</th>
                          <th>Po slevě/bal.<br>(s DPH)</th>
                          <th>Počet</th>
                          <th>Celkem<br>bez DPH</th>
                      </tr>
                  </thead>
                  <tbody id="sec-body-${sectionIdx}"></tbody>
              </table>
           </div>
        `;
        
        container.appendChild(sectionDiv);
        const tbody = document.getElementById(`sec-body-${sectionIdx}`);

        items.forEach((item, itemIdx) => {
            const divisor = item.portions || item.pack;
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
              <td class="col-product">${item.name}</td>
              <td>${item.vol}</td>
              <td>${item.pack}</td>
              <td>${item.price.toFixed(2)}</td>
              <td class="unit-price base-unit-price">0.00</td>
              <td><input type="number" class="item-disc disc" data-section="${sectionIdx}" data-item="${itemIdx}" value="0" min="0" oninput="updateAll()"></td>
              <td class="final-pack-price">0.00</td>
              <td class="final-unit-price">0.00</td>
              <td class="unit-price final-vat-price">0.00</td>
              <td><input type="number" class="qty" data-section="${sectionIdx}" data-item="${itemIdx}" value="0" min="0" oninput="updateAll()"></td>
              <td class="row-total">0.00</td>
            `;
            tbody.appendChild(tr);
        });
        sectionIdx++;
    }
    updateAll();
}

function updateAll() {
    let grandTotalQty = 0;
    let grandTotalPrice = 0;
    let grandTotalVat = 0;

    const sections = document.querySelectorAll('.section-wrapper');
    sections.forEach((sec, sIdx) => {
        const secDisc = parseFloat(sec.querySelector('.sec-disc').value) || 0;
        const rows = sec.querySelectorAll('tbody tr');
        
        rows.forEach((row, iIdx) => {
            const sectionKey = Object.keys(pricingData)[sIdx];
            const itemData = pricingData[sectionKey][iIdx];
            const divisor = itemData.portions || itemData.pack;
            
            const itemDisc = parseFloat(row.querySelector('.item-disc').value) || 0;
            const qty = parseInt(row.querySelector('.qty').value) || 0;

            const totalDisc = Math.min(100, secDisc + itemDisc);
            const discFactor = (1 - totalDisc / 100);

            const baseUnitPrice = itemData.price / divisor;
            const finalPackPrice = itemData.price * discFactor;
            const finalUnitPrice = finalPackPrice / divisor;
            
            const vatFactor = 1 + (itemData.vatRate / 100);
            const finalPackVat = finalPackPrice * vatFactor;

            const rowTotal = finalPackPrice * qty;
            const rowTotalVat = finalPackVat * qty;

            row.querySelector('.base-unit-price').innerText = baseUnitPrice.toFixed(2);
            row.querySelector('.final-pack-price').innerText = finalPackPrice.toFixed(2);
            row.querySelector('.final-unit-price').innerText = finalUnitPrice.toFixed(2);
            row.querySelector('.final-vat-price').innerText = finalPackVat.toFixed(2);
            row.querySelector('.row-total').innerText = rowTotal.toFixed(2);

            grandTotalQty += qty;
            grandTotalPrice += rowTotal;
            grandTotalVat += rowTotalVat;
        });
    });

    document.getElementById('grand-total-qty').innerText = grandTotalQty;
    document.getElementById('grand-total-price').innerText = grandTotalPrice.toLocaleString('cs-CZ', {minimumFractionDigits: 2});
    document.getElementById('grand-total-vat').innerText = grandTotalVat.toLocaleString('cs-CZ', {minimumFractionDigits: 2});
}

function exportPDF() {
    const element = document.getElementById('app-content');
    const opt = {
        margin:       [10, 5, 10, 5],
        filename:     'Cenik_Coca-Cola_Nealko_2026.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
    };
    html2pdf().set(opt).from(element).save();
}

window.onload = renderApp;
