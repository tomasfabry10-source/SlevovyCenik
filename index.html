<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COCA-COLA SLEVOVÝ CENÍK</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --cc-red: #ed1c24; --cc-black: #000000; }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background-color: #f4f4f4; 
            color: #333; 
        }

        .container { 
            max-width: 1200px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.1); 
        }

        h1 { 
            color: var(--cc-red); 
            border-bottom: 3px solid var(--cc-red); 
            padding-bottom: 10px; 
            margin-top: 0; 
            font-size: 1.5rem;
            text-align: center;
        }
        
        .header-fields { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 15px; 
            margin-bottom: 25px; 
            background: #fff5f5; 
            padding: 15px; 
            border-radius: 5px; 
            border: 1px solid #ffcccc; 
        }

        .field-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.85em; color: #555; }
        input[type="text"], input[type="number"] { 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 16px; 
        }

        .section-header { 
            background: var(--cc-black); 
            color: white; 
            padding: 12px 15px; 
            margin-top: 30px; 
            display: flex; 
            flex-wrap: wrap;
            justify-content: space-between; 
            align-items: center; 
            border-radius: 4px 4px 0 0; 
            gap: 10px;
        }

        .section-discount-input { display: flex; align-items: center; gap: 10px; font-size: 0.85em; }
        .section-discount-input input { width: 50px; padding: 5px; border-radius: 3px; border: none; text-align: center; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid #ddd;
            margin-bottom: 5px;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.85rem; 
            min-width: 900px; 
        }

        th { background: #f8f8f8; text-align: left; padding: 12px 8px; border-bottom: 2px solid #ddd; white-space: nowrap; }
        td { padding: 10px 8px; border-bottom: 1px solid #eee; }
        
        input.qty { width: 50px; padding: 5px; text-align: center; font-weight: bold; }
        input.disc { width: 45px; padding: 5px; text-align: center; }

        .row-total { font-weight: bold; color: var(--cc-black); white-space: nowrap; }
        .final-unit-price { font-weight: bold; color: #d32f2f; white-space: nowrap; }
        .unit-price { color: #888; font-size: 0.9em; white-space: nowrap; }

        .summary-bar { 
            background: var(--cc-red); 
            color: white; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            gap: 10px;
            border-radius: 8px; 
            margin-top: 30px; 
            font-size: 1.2em; 
            font-weight: bold; 
            text-align: center;
        }

        @media (min-width: 600px) {
            .summary-bar { flex-direction: row; justify-content: space-between; text-align: left; }
            h1 { font-size: 2rem; }
        }

        .btn-export { 
            background: #28a745; 
            color: white; 
            border: none; 
            padding: 15px 25px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 1em; 
            font-weight: bold; 
            width: 100%;
            margin-bottom: 20px; 
        }

        @media print { 
            .no-print { display: none !important; } 
            .container { box-shadow: none; border: none; padding: 0; max-width: 100%; } 
            body { margin: 0; padding: 0; background-color: white; }
            .table-responsive { overflow: visible; }
            table { min-width: 100%; font-size: 7pt; }
        }
    </style>
</head>
<body>

<div class="container" id="app-content">
    <h1>COCA-COLA SLEVOVÝ CENÍK</h1>
    
    <button class="btn-export no-print" onclick="exportPDF()">Exportovat do PDF / Uložit</button>

    <div class="header-fields">
        <div class="field-group">
            <label>Zákazník:</label>
            <input type="text" id="cust-name" placeholder="Název provozovny">
        </div>
        <div class="field-group">
            <label>Obchodní zástupce:</label>
            <input type="text" id="creator-name" placeholder="Vaše jméno">
        </div>
        <div class="field-group">
            <label>Kontakt:</label>
            <input type="text" id="creator-contact" placeholder="Telefon / Email">
        </div>
    </div>

    <div id="sections-container"></div>

    <div class="summary-bar">
        <div>Celkem balení: <span id="grand-total-qty">0</span> ks</div>
        <div>Celkem bez DPH: <span id="grand-total-price">0.00</span> Kč</div>
    </div>
</div>

<script>
const pricingData = {
    "Vratné skleněné lahve": [
        { name: "Coca-Cola / Zero / Fanta / Sprite", vol: "0.20", pack: 24, price: 552.00 },
        { name: "Fuzetea (všechny druhy)", vol: "0.25", pack: 24, price: 576.00 },
        { name: "Kinley (Tonic / Ginger / Purple / Rose)", vol: "0.25", pack: 24, price: 592.80 },
        { name: "Cappy 100% (Pomeranč, Jablko)", vol: "0.25", pack: 24, price: 744.00 },
        { name: "Cappy Nektar (Jahoda, Rybíz, Multivitamín)", vol: "0.25", pack: 24, price: 624.00 },
        { name: "Natura (Perlivá, Jemná, Neperlivá)", vol: "0.30", pack: 24, price: 199.20 },
        { name: "Coca-Cola / Zero / Fanta / Sprite", vol: "0.33", pack: 24, price: 592.80 },
        { name: "Römerquelle (všechny druhy)", vol: "0.33", pack: 20, price: 340.00 },
        { name: "Römerquelle (Sycená / Nesycená)", vol: "0.75", pack: 12, price: 408.00 }
    ],
    "Nevratné skleněné lahve": [
        { name: "Three Cents (všechny druhy)", vol: "0.20", pack: 24, price: 672.00 }
    ],
    "Plechovky": [
        { name: "Coca-Cola / Zero / Fanta / Sprite", vol: "0.33", pack: 24, price: 510.43 },
        { name: "Kinley (všechny druhy)", vol: "0.25", pack: 24, price: 510.43 },
        { name: "Monster Energy (všechny druhy)", vol: "0.50", pack: 12, price: 387.96 }
    ],
    "Plastové lahve (PET)": [
        { name: "Coca-Cola / Zero / Fanta / Sprite", vol: "0.50", pack: 12, price: 310.94 },
        { name: "Kinley (všechny druhy)", vol: "0.50", pack: 12, price: 309.00 },
        { name: "Fuzetea (všechny druhy)", vol: "0.50", pack: 12, price: 319.68 },
        { name: "Cappy (všechny druhy)", vol: "0.33", pack: 12, price: 309.00 },
        { name: "Natura (všechny druhy)", vol: "0.50", pack: 12, price: 169.20 },
        { name: "Natura Sport", vol: "0.75", pack: 12, price: 238.80 },
        { name: "Powerade (všechny druhy)", vol: "0.50", pack: 12, price: 418.80 }
    ],
    "Nápoje od 1L": [
        { name: "Cappy pomeranč 100%", vol: "1.00", pack: 6, price: 368.63 },
        { name: "Cappy jablko 100%", vol: "1.00", pack: 6, price: 276.26 },
        { name: "Cappy pomeranč nektar", vol: "1.00", pack: 6, price: 276.26 },
        { name: "Cappy jahoda / multivitamin", vol: "1.00", pack: 6, price: 276.26 },
        { name: "Cappy Pulpy (Orange / Grapefruit)", vol: "1.00", pack: 6, price: 207.62 },
        { name: "Fuzetea (všechny druhy)", vol: "1.50", pack: 6, price: 229.20 },
        { name: "Natura (všechny druhy)", vol: "1.50", pack: 6, price: 89.88 },
        { name: "Natura kojenecká", vol: "1.50", pack: 6, price: 94.98 },
        { name: "Kinley (všechny druhy)", vol: "1.50", pack: 6, price: 213.00 },
        { name: "Coca-Cola (všechny druhy)", vol: "1.50", pack: 6, price: 207.09 },
        { name: "Fanta / Sprite (všechny druhy)", vol: "1.50", pack: 6, price: 207.09 },
        { name: "Coca-Cola / Fanta / Sprite", vol: "1.00", pack: 12, price: 384.00 }
    ],
    "B-I-B Postmix": [
        { name: "Coca-Cola 20L BIB (128L nápoje)", vol: "20 L", pack: 1, portions: 1280, price: 6068.00 },
        { name: "Coca-Cola / Zero / Kinley 5L BIB (32L nápoje)", vol: "5 L", pack: 1, portions: 320, price: 1517.00 },
        { name: "Fanta / Sprite 5L BIB (27L nápoje)", vol: "5 L", pack: 1, portions: 270, price: 1290.00 }
    ]
};

function renderApp() {
    const container = document.getElementById('sections-container');
    let sectionIdx = 0;

    for (const [sectionName, items] of Object.entries(pricingData)) {
        const isBIB = sectionName.includes("B-I-B");
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'section-wrapper';
        
        sectionDiv.innerHTML = `
            <div class="section-header">
                <span>${sectionName}</span>
                <div class="section-discount-input no-print">
                    Plošná sleva sekce: <input type="number" class="sec-disc" data-section="${sectionIdx}" value="0" min="0" oninput="updateAll()"> %
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 250px;">Výrobek</th>
                            <th>Objem</th>
                            <th>Balení</th>
                            <th>Cena bal.</th>
                            <th>${isBIB ? 'Cena/0,1L' : 'Cena/ks'}</th>
                            <th>Sleva %</th>
                            <th>${isBIB ? 'Sleva/0,1L' : 'Po slevě/ks'}</th>
                            <th>Po slevě/bal.</th>
                            <th>Počet</th>
                            <th>Celkem</th>
                        </tr>
                    </thead>
                    <tbody id="sec-body-${sectionIdx}"></tbody>
                </table>
            </div>
        `;
        
        container.appendChild(sectionDiv);
        const tbody = document.getElementById(`sec-body-${sectionIdx}`);

        items.forEach((item, itemIdx) => {
            const divisor = item.portions || item.pack;
            const unitPrice = item.price / divisor;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="white-space: normal;">${item.name}</td>
                <td>${item.vol}</td>
                <td>${item.pack} ks</td>
                <td>${item.price.toFixed(2)}</td>
                <td class="unit-price">${unitPrice.toFixed(2)}</td>
                <td><input type="number" class="item-disc disc" data-section="${sectionIdx}" data-item="${itemIdx}" value="0" min="0" oninput="updateAll()"></td>
                <td class="final-unit-price">0.00</td>
                <td class="final-pack-price">0.00</td>
                <td><input type="number" class="qty" data-section="${sectionIdx}" data-item="${itemIdx}" value="0" min="0" oninput="updateAll()"></td>
                <td class="row-total">0.00</td>
            `;
            tbody.appendChild(tr);
        });
        sectionIdx++;
    }
    updateAll();
}

function updateAll() {
    let grandTotalQty = 0;
    let grandTotalPrice = 0;

    const sections = document.querySelectorAll('.section-wrapper');
    sections.forEach((sec, sIdx) => {
        const secDisc = parseFloat(sec.querySelector('.sec-disc').value) || 0;
        const rows = sec.querySelectorAll('tbody tr');
        
        rows.forEach((row, iIdx) => {
            const sectionKey = Object.keys(pricingData)[sIdx];
            const itemData = pricingData[sectionKey][iIdx];
            const basePrice = itemData.price;
            const divisor = itemData.portions || itemData.pack;
            
            const itemDisc = parseFloat(row.querySelector('.item-disc').value) || 0;
            const qty = parseInt(row.querySelector('.qty').value) || 0;

            const totalDisc = Math.min(100, secDisc + itemDisc);
            const finalPackPrice = basePrice * (1 - totalDisc / 100);
            const finalUnitPrice = finalPackPrice / divisor;
            const rowTotal = finalPackPrice * qty;

            row.querySelector('.final-unit-price').innerText = finalUnitPrice.toFixed(2);
            row.querySelector('.final-pack-price').innerText = finalPackPrice.toFixed(2);
            row.querySelector('.row-total').innerText = rowTotal.toFixed(2);

            grandTotalQty += qty;
            grandTotalPrice += rowTotal;
        });
    });

    document.getElementById('grand-total-qty').innerText = grandTotalQty;
    document.getElementById('grand-total-price').innerText = grandTotalPrice.toLocaleString('cs-CZ', {minimumFractionDigits: 2});
}

function exportPDF() {
    const element = document.getElementById('app-content');
    const opt = {
        margin:       [10, 5, 10, 5],
        filename:     'Cenik_Coca-Cola_2026.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
    };
    html2pdf().set(opt).from(element).save();
}

window.onload = renderApp;
</script>

</body>
</html>
